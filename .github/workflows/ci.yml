name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.6
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Require real PTY execution
        env:
          AGENT_BRIDGE_REQUIRE_PTY: '1'
        run: npm run test:pty
      - run: npm run check
      - name: Run coverage thresholds
        if: matrix.node-version != 22.6
        run: npm run test:coverage
      - run: npm run build
      - run: npm pack --dry-run
